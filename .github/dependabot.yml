# Keeps GitHub Actions (pinned by commit SHA) and Gradle dependencies up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: gradle
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      server-dependencies:
        patterns: ["*"]
