# Keeps pinned versions up to date. Each ecosystem gets one grouped pull request a week.
version: 2
updates:
  # Workflow actions, pinned by commit SHA
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Server dependencies, Gradle plugins and the Gradle wrapper
  - package-ecosystem: gradle
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      server-dependencies:
        patterns: ["*"]

  # Images of the local environment (databases, monitoring, mock server)
  - package-ecosystem: docker-compose
    directory: /ops/compose
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      compose-images:
        patterns: ["*"]

  # Base images of the server Dockerfile (JDK for the build, JRE for the runtime), pinned by version and digest
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      server-images:
        patterns: ["*"]
