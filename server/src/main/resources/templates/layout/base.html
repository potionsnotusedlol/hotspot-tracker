<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null} ? ${title} + ' - Wi-Fi Москвы' : 'Wi-Fi Москвы'">Wi-Fi Москвы</title>
    
    <!-- CSS переменные и базовые стили -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    
    <!-- Leaflet для карт -->
    <link rel="stylesheet" th:href="@{/webjars/leaflet/1.9.4/dist/leaflet.min.css}">
    
    <!-- Специфичные стили страницы -->
    <th:block th:insert="~{this :: additional-css}" />
</head>
<body>
    <!-- Шапка -->
    <div th:insert="~{layout/header.html}"></div>
    
    <!-- Навигация -->
    <div th:insert="~{layout/navigation.html}"></div>
    
    <!-- Основной контент -->
    <main class="main-content">
        <th:block th:insert="~{this :: content}" />
    </main>
    
    <!-- Футер -->
    <div th:insert="~{layout/footer.html}"></div>
    
    <!-- HTMX для динамики -->
    <script th:src="@{/webjars/htmx.org/1.9.10/dist/htmx.min.js}"></script>
    
    <!-- Chart.js для графиков -->
    <script th:src="@{/webjars/chart.js/4.4.1/dist/chart.min.js}"></script>
    
    <!-- Leaflet для карт -->
    <script th:src="@{/webjars/leaflet/1.9.4/dist/leaflet.min.js}"></script>
    
    <!-- Основной JS -->
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/charts.js}"></script>
    <script th:src="@{/js/map.js}"></script>
    
    <!-- Специфичные скрипты страницы -->
    <th:block th:insert="~{this :: additional-js}" />
</body>
</html>

<!-- Блоки по умолчанию (переопределяются в наследующих шаблонах) -->
<th:block th:fragment="additional-css"></th:block>
<th:block th:fragment="additional-js"></th:block>
<th:block th:fragment="content"></th:block>
