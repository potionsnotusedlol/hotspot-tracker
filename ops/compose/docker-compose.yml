# Local development infrastructure: PostgreSQL + PostGIS and Redis,
# plus optional services: the API server (profile "app"), monitoring (profile "monitoring")
# and an API mock server (profile "mock").
# Usage: see ops/README.md
name: hotspot

services:
  postgres:
    # PostgreSQL 18 + PostGIS 3.6. The tag does not include the PostgreSQL patch version,
    # so the digest pins the exact image.
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotspot}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in ops/compose/.env}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-hotspot_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in ops/compose/.env}
      DB_APP_USER: ${DB_APP_USER:-hotspot_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in ops/compose/.env}
    ports:
      # 5433 by default, so it does not clash with a locally installed PostgreSQL on 5432
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Since PostgreSQL 18 the image keeps data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level up.
      - postgres-data:/var/lib/postgresql
      # Mounted as a single file: the image already has 10_postgis.sh in this directory.
      - ./initdb/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API server, built from server/Dockerfile. It connects as the application role
  # (no DDL) and runs Flyway migrations as the migration role.
  app:
    profiles: [app]
    build:
      context: ../../server
    image: hotspot-server:local
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hotspot}
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USER:-hotspot_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in ops/compose/.env}
      SPRING_FLYWAY_USER: ${DB_MIGRATION_USER:-hotspot_migrator}
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in ops/compose/.env}
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  # Monitoring: Prometheus collects metrics, Grafana shows them (dashboards are provisioned from ops/grafana).
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # The exporters connect with the application role: it can read the statistics views used for the dashboards.
  postgres-exporter:
    profiles: [monitoring]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-hotspot}?sslmode=disable
      DATA_SOURCE_USER: ${DB_APP_USER:-hotspot_app}
      DATA_SOURCE_PASS: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in ops/compose/.env}
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    profiles: [monitoring]
    image: oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # Serves example responses from docs/openapi.yaml, so clients can be built before the backend.
  mock:
    profiles: [mock]
    image: stoplight/prism:5.15.10
    restart: unless-stopped
    # Prism 5.15.10 crashes on startup with its default multiprocess mode
    command: ["mock", "--host", "0.0.0.0", "--multiprocess", "false", "/spec/openapi.yaml"]
    ports:
      - "127.0.0.1:${MOCK_PORT:-4010}:4010"
    volumes:
      - ../../docs/openapi.yaml:/spec/openapi.yaml:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4010"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
