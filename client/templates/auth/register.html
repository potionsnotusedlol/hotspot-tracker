<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Регистрация', ~{::main})}">
<body>
<main id="main" class="main-content" tabindex="-1">
    <div class="container page-narrow">
        <h1>Регистрация</h1>

        <div th:if="${error != null}" class="alert alert-error" role="alert" th:text="${error}">Ошибка</div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input id="reg-email" type="email" name="email" th:value="${email}" autocomplete="email" required maxlength="255">
            </div>
            <div class="form-group">
                <label for="reg-password">Пароль, от 8 символов</label>
                <input id="reg-password" type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128">
            </div>
            <div class="form-group">
                <label for="reg-password-repeat">Повторите пароль</label>
                <input id="reg-password-repeat" type="password" name="passwordRepeat" autocomplete="new-password" required minlength="8" maxlength="128">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Создать аккаунт</button>
                <a href="/login">Уже есть аккаунт</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
